name: Android 0.5 CI

on:
  push:
    branches: [ "main", "development-0.5" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Prepare development signing key
        run: |
          mkdir -p ci
          base64 -d ci/dev-keystore.p12.b64 > ci/dev-keystore.p12

      - name: Regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Budowlanka.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budowlanka-APK
          path: Budowlanka.apk
          if-no-files-found: error

      - name: Publish development APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/development-0.5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: development-latest
          name: Budowlanka Development
          target_commitish: development-0.5
          prerelease: true
          make_latest: false
          files: Budowlanka.apk

      - name: GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Budowlanka.apk
          generate_release_notes: true
